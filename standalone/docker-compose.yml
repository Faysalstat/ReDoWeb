# This file is kept only so `docker compose up -d` here is a harmless no-op
# for anyone following old muscle memory; there is nothing left to start.
# Bring up the shared instance instead:
#   cd "G:\Standalone Services\postgres" && docker compose up -d
name: redowebs

services: {}
