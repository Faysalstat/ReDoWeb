# container. It now uses the shared Postgres instance that serves every
# project on this machine, at G:\Standalone Services\postgres (container
# `shared-postgres`, host port 5432). That compose file's init script
# already provisions the `redowebs` role/database this app connects to --
# see `backend/app/config.py`'s `database_url` default.
