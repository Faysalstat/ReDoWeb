<div class="relative flex min-h-screen items-center text-ink">
  <div appParallaxHero class="mx-auto w-full max-w-md px-6 py-20">
    <app-card variant="glass" class="animate-fade-up mx-auto text-center" style="--fade-delay: 0.08s">
      <div class="mb-5 flex items-center justify-center gap-2.5">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-accent to-accent-teal text-base font-bold text-white shadow-cta-glow"
        >
          R
        </div>
        <span class="text-xl font-bold tracking-tight text-ink">ReDoWebs</span>
      </div>

      <p class="text-sm text-ink-muted">Redesign your website with AI</p>

      <app-badge variant="accent" class="mt-5 inline-flex">AI-powered website modernization</app-badge>

      <p class="mx-auto mt-5 max-w-sm text-sm leading-relaxed text-ink-muted">
        Sign in to crawl your site, get an AI-generated brand blueprint, and preview a modern
        redesign — free to try, no credit card required.
      </p>

      <button
        type="button"
        (click)="onGoogleLoginClick()"
        class="mt-8 flex w-full items-center justify-center gap-3 rounded-lg border border-white/15 bg-white px-5 py-3 text-sm font-medium text-gray-800 shadow-sm transition-all duration-200 hover:shadow-md active:scale-[0.98]"
      >
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"
          />
          <path
            fill="#FF3D00"
            d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 10.7z"
          />
          <path
            fill="#4CAF50"
            d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.9 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.5 40.5 16.2 45 24 45z"
          />
          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.4 36 45 30.6 45 24c0-1.4-.1-2.7-.4-3.5z"
          />
        </svg>
        Continue with Google
      </button>

      <p class="mt-5 text-center text-xs text-ink-muted">3 free credits on signup • Free preview always</p>
    </app-card>
  </div>
</div>
