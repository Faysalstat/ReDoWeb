<div>
  <div class="row row--between">
    <div>
      <h1 class="display display--sm">Overview</h1>
      <p class="sub">AI usage, cost, revenue, and platform activity at a glance.</p>
    </div>

    <div class="seg" role="group" aria-label="Date range">
      @for (days of rangePresets; track days) {
        <label class="seg-opt">
          <input type="radio" name="range" [checked]="selectedDays() === days" (change)="selectRange(days)" />
          {{ days }}d
        </label>
      }
    </div>
  </div>

  @if (loading()) {
    <div class="row" style="justify-content: center; padding: calc(2 * var(--leading)) 0">
      <app-spinner size="lg" />
    </div>
  } @else if (errorMessage()) {
    <app-card variant="danger" style="margin-top: var(--space-6)">
      <p style="font-size: 14px; margin: 0">{{ errorMessage() }}</p>
    </app-card>
  } @else if (stats(); as s) {
    <div class="panel" style="margin-top: calc(1.2 * var(--leading))">
      <div class="panel__head"><strong>Activity</strong></div>
      <div class="cells cells--4">
        <app-stat-tile label="Total users" [value]="s.users_total" [note]="'+' + s.users_new_in_range + ' in range'" />
        <app-stat-tile
          label="Total projects"
          [value]="s.projects_total"
          [note]="'+' + s.projects_in_range + ' in range'"
        />
        <app-stat-tile
          label="Generation success rate"
          [value]="s.generation_success_rate_pct !== null ? s.generation_success_rate_pct + '%' : 'No data'"
        />
        <app-stat-tile label="Active jobs running" [value]="s.active_jobs_running" />
      </div>
    </div>

    <div class="panel" style="margin-top: var(--space-4)">
      <div class="panel__head"><strong>Financials (in range)</strong></div>
      <div class="cells cells--4">
        <app-stat-tile
          label="AI cost"
          [value]="formatUsd(s.ai_cost_usd_in_range)"
          [note]="'all-time ' + formatUsd(s.ai_cost_usd_all_time)"
          variant="accent"
        />
        <app-stat-tile
          label="Revenue"
          [value]="formatUsd(s.revenue_usd_in_range)"
          [note]="'all-time ' + formatUsd(s.revenue_usd_all_time)"
          variant="accent"
        />
        <app-stat-tile
          label="Net margin"
          [value]="formatUsd(s.net_margin_usd_in_range)"
          [variant]="s.net_margin_usd_in_range < 0 ? 'danger' : 'default'"
        />
        <app-stat-tile label="Credits outstanding" [value]="s.credits_outstanding" />
      </div>
    </div>

    <div class="panel" style="margin-top: var(--space-4)">
      <div class="panel__head"><strong>Payments</strong> <span class="sub" style="font-size: 12.5px">PayPal only — test payments excluded</span></div>
      <div class="cells cells--4">
        <app-stat-tile label="Purchases (in range)" [value]="s.purchases_in_range" />
        <a routerLink="/admin/payments" [queryParams]="{ status: 'pending' }" style="text-decoration: none; color: inherit">
          <app-stat-tile
            label="Pending purchases"
            [value]="s.pending_purchases"
            [note]="s.pending_purchases > 0 ? 'review on Payments →' : 'none waiting'"
            [variant]="s.pending_purchases > 0 ? 'danger' : 'default'"
          />
        </a>
        <app-stat-tile label="Refunds (in range)" [value]="s.refunds_in_range" />
        <app-stat-tile label="Paying users (all-time)" [value]="s.paying_users" />
      </div>
    </div>
  }
</div>
